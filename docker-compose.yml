services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: relight-server
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
    networks:
      - relight-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: relight-client
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - relight-network
    restart: unless-stopped

networks:
  relight-network:
    driver: bridge